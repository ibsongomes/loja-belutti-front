<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Belutti</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <h2>Recuperar Senha</h2>
            <p id="stepDescription">Informe o e-mail cadastrado para gerar seu código de redefinição.</p>

            <!-- ETAPA 1: SOLICITAR CÓDIGO -->
            <form id="forgotForm">
                <div class="input-group">
                    <label for="recoverEmail">E-mail cadastrado</label>
                    <input type="email" id="recoverEmail" required placeholder="seu@email.com">
                </div>
                <button type="submit" class="btn-login">Gerar Código de Recuperação</button>
            </form>

            <!-- ETAPA 2: REDEFINIR SENHA (OCULTA INICIALMENTE) -->
            <form id="resetForm" style="display: none;">
                <div id="tokenBanner" style="background: #F8F5F2; border: 1px dashed #1A1A1A; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 14px; word-break: break-all;"></div>

                <div class="input-group">
                    <label for="resetToken">Código de Recuperação</label>
                    <input type="text" id="resetToken" required placeholder="Cole o código aqui">
                </div>

                <div class="input-group">
                    <label for="newPassword">Nova Senha</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>

                <button type="submit" class="btn-login">Salvar Nova Senha</button>
            </form>

            <p id="recoverFeedback" style="font-size: 13px; font-weight: bold; margin-top: 12px;"></p>
            <p class="register-link"><a href="./login.html">← Voltar para o Login</a></p>
        </div>
    </div>

    <script src="../../js/core/config.js"></script>
    <script>
        const forgotForm = document.getElementById('forgotForm');
        const resetForm = document.getElementById('resetForm');
        const feedback = document.getElementById('recoverFeedback');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.innerText = '';
            const email = document.getElementById('recoverEmail').value.trim();

            try {
                const res = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    forgotForm.style.display = 'none';
                    resetForm.style.display = 'block';
                    document.getElementById('stepDescription').innerText = 'Crie uma nova senha para sua conta Belutti.';
                    document.getElementById('resetToken').value = data.resetToken;
                    document.getElementById('tokenBanner').innerHTML = `<strong>Código gerado:</strong> ${data.resetToken}`;
                } else {
                    feedback.style.color = '#c0392b';
                    feedback.innerText = data.error;
                }
            } catch (err) {
                feedback.style.color = '#c0392b';
                feedback.innerText = 'Erro ao conectar com o servidor.';
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('resetToken').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    feedback.style.color = '#2e7d32';
                    feedback.innerText = data.message;
                    setTimeout(() => window.location.assign(window.location.pathname.includes('/pages/') ? '../auth/login.html' : './pages/auth/login.html'), 1500);
                } else {
                    feedback.style.color = '#c0392b';
                    feedback.innerText = data.error;
                }
            } catch (err) {
                feedback.style.color = '#c0392b';
                feedback.innerText = 'Erro ao redefinir senha.';
            }
        });
    </script>
</body>
</html>
