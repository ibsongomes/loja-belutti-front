<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Belutti</title>
    <link rel="stylesheet" href="../../css/auth.css">
    <style>
        /* Libera a rolagem e dá respiro no topo e embaixo para o formulário não cortar */
        body.login-body {
            height: auto !important;
            min-height: 100vh !important;
            overflow-y: auto !important;
            align-items: flex-start !important;
            padding: 40px 15px !important;
            box-sizing: border-box;
        }

        /* Destrava a largura do container e amplia a caixa para acomodar as 3 colunas com folga */
        .login-container {
            max-width: 780px !important;
            width: 100% !important;
            margin: 0 auto !important;
        }

        .login-box {
            max-width: 780px !important;
            width: 100% !important;
            box-sizing: border-box;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1.2fr;
            gap: 16px;
            align-items: end;
        }

        .cep-helper {
            display: inline-block;
            font-size: 12px;
            color: #1A1A1A;
            text-decoration: underline;
            margin-top: 5px;
        }

        .input-group input:disabled {
            background-color: #ececec;
            color: #777;
            cursor: not-allowed;
            border-color: #dcdcdc;
        }

        .section-divider {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 0 12px 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
            text-align: left;
        }

        @media (max-width: 650px) {
            .form-row, .form-row-3 {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <h2>Criar Conta</h2>
            <p>Junte-se à Belutti e acompanhe seus pedidos.</p>
            
            <form id="registerForm">
                <div class="section-divider">Dados Pessoais</div>

                <div class="input-group">
                    <label for="name">* Nome Completo</label>
                    <input type="text" id="name" required placeholder="Ex: João da Silva">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="cpf">* CPF</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
                    </div>

                    <div class="input-group">
                        <label for="birthDate">* Data de Nascimento</label>
                        <input type="text" id="birthDate" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">* E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="password">* Senha</label>
                        <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">* Confirmar Senha</label>
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="Repita a senha">
                    </div>
                </div>

                <div class="section-divider">Endereço de Entrega</div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="cep">* CEP</label>
                        <input type="text" id="cep" required placeholder="00000-000" maxlength="9">
                        <a href="https://buscacepinter.correios.com.br/app/endereco/index.php" target="_blank" rel="noopener noreferrer" class="cep-helper">
                            Não sei meu CEP
                        </a>
                    </div>

                    <div class="input-group">
                        <label for="street">* Logradouro / Endereço</label>
                        <input type="text" id="street" required disabled placeholder="Aguardando CEP...">
                    </div>
                </div>

                <div class="form-row-3">
                    <div class="input-group">
                        <label for="number">* Número</label>
                        <input type="text" id="number" required disabled placeholder="Ex: 120">
                    </div>

                    <div class="input-group">
                        <label for="complement">Complemento (opcional)</label>
                        <input type="text" id="complement" disabled placeholder="Apto, Bloco...">
                    </div>

                    <div class="input-group">
                        <label for="neighborhood">* Bairro</label>
                        <input type="text" id="neighborhood" required disabled placeholder="Bairro">
                    </div>
                </div>

                <div class="form-row-3">
                    <div class="input-group">
                        <label for="state">* Estado</label>
                        <input type="text" id="state" required disabled placeholder="UF">
                    </div>

                    <div class="input-group">
                        <label for="city">* Cidade</label>
                        <input type="text" id="city" required disabled placeholder="Cidade">
                    </div>

                    <div class="input-group">
                        <label for="reference">Ponto de referência (opcional)</label>
                        <input type="text" id="reference" disabled placeholder="Ex: Próximo à praça">
                    </div>
                </div>
                
                <button type="submit" class="btn-login" style="margin-top: 15px;">Cadastrar</button>
            </form>
            
            <p class="register-link">Já tem uma conta? <a href="./login.html">Faça Login</a></p>
        </div>
    </div>

    <script src="../../js/core/config.js"></script>
    <script src="../../js/pages/cadastro.js"></script>
</body>
</html>
