<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Belutti</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/global.css">
    <style>
        .admin-wrapper { max-width: 1150px; margin: 40px auto; padding: 0 20px; min-height: 65vh; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 25px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card span { font-size: 12px; color: #666; text-transform: uppercase; font-weight: bold; }
        .stat-card h3 { margin: 8px 0 0 0; font-size: 24px; color: #1A1A1A; }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0dcd7; padding-bottom: 10px; flex-wrap: wrap; }
        .admin-tab-btn { padding: 10px 18px; border: none; border-radius: 6px; background: #fff; color: #444; font-weight: bold; cursor: pointer; font-size: 14px; }
        .admin-tab-btn.active { background: #1A1A1A; color: #fff; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .admin-card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 4px solid #1A1A1A; }
        .admin-card-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 12px; }
        .status-select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-weight: bold; font-size: 13px; cursor: pointer; background: #F8F5F2; }
        .btn-danger-sm { padding: 8px 12px; background: #c0392b; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-danger-sm:hover { background: #a93226; }
        .stock-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 14px 20px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); flex-wrap: wrap; gap: 12px; }
    </style>
</head>
<body style="background-color: #F8F5F2;">

    <header>
        <div class="header-main">
            <a href="../../index.html" class="logo">BELUTTI <span style="font-size: 12px; background: #1A1A1A; color: #fff; padding: 3px 8px; border-radius: 4px; vertical-align: middle;">ADMIN</span></a>
            <nav class="nav-menu">
                <ul>
                    <li><a href="../../index.html">Ver Loja</a></li>
                    <li><a href="./minha-conta.html?cliente=1">Meus Dados</a></li>
                    <li><a href="#" id="adminLogoutBtn" style="color: #c0392b;">Sair</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="admin-wrapper">
        <div class="admin-header">
            <h2 style="margin: 0; color: #1A1A1A;">Painel do Administrador</h2>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span>Total de Pedidos</span>
                <h3 id="statTotalOrders">0</h3>
            </div>
            <div class="stat-card">
                <span>Faturamento Válido</span>
                <h3 id="statRevenue">R$ 0,00</h3>
            </div>
            <div class="stat-card">
                <span>Contas Cadastradas</span>
                <h3 id="statTotalUsers">0</h3>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-panel="orders"><i class="fas fa-box"></i> Pedidos</button>
            <button class="admin-tab-btn" data-panel="stock"><i class="fas fa-tshirt"></i> Estoque de Roupas</button>
            <button class="admin-tab-btn" data-panel="users"><i class="fas fa-users"></i> Contas Cadastradas</button>
        </div>

        <!-- ABA 1: PEDIDOS -->
        <div id="panel-orders" class="admin-panel active">
            <div id="adminOrdersList"><p style="color: #666;">Carregando pedidos...</p></div>
        </div>

        <!-- ABA 2: ESTOQUE -->
        <div id="panel-stock" class="admin-panel">
            <div id="adminStockList"><p style="color: #666;">Carregando estoque...</p></div>
        </div>

        <!-- ABA 3: CONTAS -->
        <div id="panel-users" class="admin-panel">
            <div id="adminUsersList"><p style="color: #666;">Carregando contas...</p></div>
        </div>
    </main>

    <script src="../../js/core/config.js"></script>
    <script src="../../js/pages/admin.js"></script>
</body>
</html>
